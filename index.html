<title>Chiripa</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Diseño: una columna de teléfono con listas agrupadas, barra de pestañas flotante de vidrio y hojas inferiores, al estilo iOS. */
:root{
  --font:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg:#F6F6F6; --stage:#D8DADA; --surface:#FFFFFF; --sheet-bg:#F0F0F0; --sheet-surface:#FFFFFF;
  --fill:rgba(17,17,17,.07); --fill2:rgba(17,17,17,.14);
  --fg:#000000; --fg2:#6F7171; --fg3:#A7A8A8; --sep:#D8DADA;
  --accent:#EE0000; --accent-soft:rgba(238,0,0,.09); --accent-fg:#FFFFFF;
  --green:#34C759; --green-soft:rgba(52,199,89,.15); --red:#CD040B; --red-soft:rgba(179,0,27,.1);
  --orange:#D97706; --pink:#EE0000; --teal:#5F5F5F; --indigo:#111111; --gray:#8E8E8E;
  --pos:#1FA544;
  --glass:rgba(250,250,252,.74); --glass-b:rgba(255,255,255,.7);
  --shadow:0 1px 1px rgba(0,0,0,.03),0 12px 32px rgba(0,0,0,.1);
  --scrim:rgba(0,0,0,.4);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --stage:#0A0A0A; --surface:#161616; --sheet-bg:#161616; --sheet-surface:#242424;
  --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --fg:#FFFFFF; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
  --accent:#FF3030; --accent-soft:rgba(255,48,48,.2);
  --green:#30D158; --green-soft:rgba(48,209,88,.18); --red:#FF6B7D; --red-soft:rgba(255,107,125,.16);
  --orange:#F59E0B; --pink:#FF3030; --teal:#8A8A8A; --indigo:#3A3A3A; --gray:#6E6E6E; --pos:#30D158;
  --glass:rgba(34,34,36,.72); --glass-b:rgba(255,255,255,.12);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --stage:#0A0A0A; --surface:#161616; --sheet-bg:#161616; --sheet-surface:#242424;
  --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --fg:#FFFFFF; --fg2:rgba(235,235,245,.62); --fg3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.55);
  --accent:#FF3030; --accent-soft:rgba(255,48,48,.2);
  --green:#30D158; --green-soft:rgba(48,209,88,.18); --red:#FF6B7D; --red-soft:rgba(255,107,125,.16);
  --orange:#F59E0B; --pink:#FF3030; --teal:#8A8A8A; --indigo:#3A3A3A; --gray:#6E6E6E; --pos:#30D158;
  --glass:rgba(34,34,36,.72); --glass-b:rgba(255,255,255,.12);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 14px 36px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--stage);color:var(--fg);font:400 1.0625rem/1.3 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{display:none}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:18px;height:18px}.i.l{width:28px;height:28px}
.pos{color:var(--pos)}.neg{color:var(--red)}.warn{color:var(--orange)}.strike{text-decoration:line-through;opacity:.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Marco de la app */
.app{position:relative;width:100%;height:100%;max-width:430px;background:var(--bg);overflow:hidden;isolation:isolate}
@media (min-width:520px) and (min-height:720px){
  .app{height:min(100%,900px);border-radius:48px;box-shadow:0 0 0 1px var(--sep),0 40px 90px rgba(0,0,0,.28)}
}
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:64px var(--gr) 118px var(--gl);scrollbar-width:none}
.navbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:20;display:flex;align-items:center}
.navbar::before{content:"";position:absolute;inset:0;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border-bottom:.5px solid var(--sep);opacity:0;transition:opacity .2s}
.scrolled .navbar::before{opacity:1}
.nb-in{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;padding-left:var(--gl);padding-right:var(--gr)}
.nb-title{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.scrolled .nb-title{opacity:1}
.nb-r{display:flex;gap:8px}
.gbtn{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 .5px var(--glass-b),0 2px 8px rgba(0,0,0,.08)}
.gbtn .badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.6875rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.ltitle{font-size:2.125rem;font-weight:700;letter-spacing:-.025em;margin:6px 0 16px;line-height:1.1}

/* Barra de pestañas */
.tabbar{position:absolute;left:var(--gl);right:var(--gr);bottom:12px;height:66px;z-index:30;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;padding:0 6px;border-radius:34px;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:var(--shadow),inset 0 0 0 .5px var(--glass-b)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;height:52px;justify-content:center;color:var(--fg2);font-size:.6875rem;font-weight:500;border-radius:26px;transition:color .15s}
.tab[aria-current="page"]{color:var(--accent);background:var(--fill)}
.tab-pay{width:56px;height:56px;margin:auto;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);box-shadow:0 8px 18px -6px rgba(238,0,0,.55);transition:transform .15s}
.tab-pay:active{transform:scale(.92)}
.tab-pay .i{width:26px;height:26px;stroke-width:2.2}

/* Secciones y listas */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.sec-h h2{margin:0;font-size:1.375rem;font-weight:700;letter-spacing:-.02em}
.sec-h button{color:var(--accent);font-size:.9375rem}
.list{background:var(--surface);border-radius:20px;overflow:hidden}
.sheet .list{background:var(--sheet-surface)}
.list+.list{margin-top:16px}
.list-h{margin:22px 16px 8px;font-size:.8125rem;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
.list-f{margin:8px 16px 0;font-size:.8125rem;color:var(--fg2);line-height:1.35}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row.ico+.row.ico::before,.row.tx+.row.tx::before{left:72px}
button.row:active,a.row:active{background:var(--fill)}
.rb{flex:1;min-width:0;display:flex;flex-direction:column}
.rb b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb small,.ra small{font-size:.8125rem;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra{display:flex;flex-direction:column;align-items:flex-end;flex:none;font-variant-numeric:tabular-nums}
.ra b{font-weight:600}
.rv{color:var(--fg2);font-size:.9375rem;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--fg3);width:16px;height:16px;stroke-width:2.4}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--tc,var(--gray));color:#fff;flex:none}
.tile .i{width:19px;height:19px}
.mk{width:var(--s,40px);height:var(--s,40px);border-radius:calc(var(--s,40px)*.26);display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--s,40px)*.46);letter-spacing:-.02em;flex:none;overflow:hidden;background:var(--mc,var(--gray));box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
.mk img{width:100%;height:100%;object-fit:cover;display:block}
.pwf{position:relative}.pwf .eyeb{width:36px;height:36px;display:grid;place-items:center;color:var(--fg2);flex:none;margin-right:-8px}.pwf .eyeb .i{width:20px;height:20px}
.pwm{display:flex;gap:4px;margin:8px 4px 0}.pwm i{flex:1;height:4px;border-radius:2px;background:var(--fill);transition:background .2s}.pwm i.on1{background:var(--red)}.pwm i.on2{background:var(--orange)}.pwm i.on3{background:#FFCC00}.pwm i.on4{background:var(--green)}
.rkey{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.rkey b{display:block;text-align:center;padding:12px 6px;border-radius:12px;background:var(--fill);font-family:var(--mono);font-size:1.0625rem;letter-spacing:.06em}
.row.tx .tile,.row.tx .av{width:44px;height:44px;border-radius:50%;--s:44px}
.row.tx .tile .i{width:21px;height:21px}
.av{width:var(--s,40px);height:var(--s,40px);border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:600;font-size:calc(var(--s,40px)*.38);flex:none;letter-spacing:.01em}
.av.me{background:linear-gradient(150deg,#FF4D4D,#EE0000)}
.sheet .row.field{padding:0 16px}

/* Botones y controles */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:27px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:1.0625rem;transition:transform .12s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35}
.btn.tint{background:var(--accent-soft);color:var(--accent)}
.btn.gray{background:var(--fill);color:var(--fg)}
.btn.red{background:var(--red-soft);color:var(--red)}
.btn.plain{background:none;color:var(--accent);height:44px}
.btn.sm{height:36px;width:auto;padding:0 16px;font-size:.9375rem;border-radius:18px}
.btn-row{display:flex;gap:12px}
.btn-row .btn{flex:1}
.pad-b{padding:12px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;background:var(--fill);font-size:.9375rem;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:12px;font-size:.8125rem;font-weight:600;background:var(--fill);color:var(--fg2)}
.pill.ok{background:var(--green-soft);color:var(--pos)}.pill.wait{background:rgba(255,149,0,.16);color:var(--orange)}.pill.bad{background:var(--red-soft);color:var(--red)}.pill.blue{background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border-radius:10px;font-size:.8125rem;font-weight:500;text-align:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}
.sw{position:relative;width:51px;height:31px;flex:none;display:block}
.sw input{position:absolute;inset:0;opacity:0;margin:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--fill2);transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.3,.7,.4,1)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:14px;padding:0 14px;height:48px}
.list .field{background:none;border-radius:0}
.field input{flex:1;min-width:0;border:0;background:none;outline:0;height:100%;font-size:1.0625rem}
.field input::placeholder{color:var(--fg3)}
.field .lab{color:var(--fg2);font-size:.9375rem;min-width:56px}
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:6px 0}
.swatch{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);display:grid;place-items:center;color:#fff}
.swatch[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.empty{text-align:center;color:var(--fg2);padding:36px 16px;font-size:.9375rem}
.note{color:var(--fg2);font-size:.8125rem;text-align:center;margin:28px 0 0;line-height:1.4}
.hs{display:flex;gap:12px;overflow-x:auto;margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding:2px var(--gr) 6px var(--gl);scroll-snap-type:x proximity;scrollbar-width:none}
.hs>*{scroll-snap-align:start;flex:none}

/* Inicio */
.bal{padding:14px 4px 4px}
.bal-l{display:flex;align-items:center;gap:8px;color:var(--fg2);font-size:.9375rem;font-weight:500}
.bal-l button{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--fg2)}
.bal-v{font-size:3.75rem;font-weight:700;letter-spacing:-.045em;line-height:1.05;font-variant-numeric:tabular-nums;margin:2px 0 12px}
.bal-v sup{font-size:1.75rem;font-weight:600;letter-spacing:-.02em;vertical-align:top;position:relative;top:.45em;color:var(--fg2)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.8125rem;font-weight:500}
.act span.c{width:100%;aspect-ratio:1.15;max-height:68px;border-radius:22px;background:var(--surface);display:grid;place-items:center;color:var(--accent);transition:transform .12s}
.act:active span.c{transform:scale(.94)}
.act span.c .i{width:26px;height:26px}
.goalc{width:150px;background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.goalc .gn{font-weight:600;line-height:1.2}
.goalc .gs{font-size:.8125rem;color:var(--fg2);font-variant-numeric:tabular-nums}
.ring{position:relative;width:52px;height:52px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4.5;stroke-linecap:round}
.ring .tr{stroke:var(--fill2)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums}
.goalc.new{align-items:center;justify-content:center;color:var(--accent);background:var(--accent-soft);gap:6px;font-weight:600}
.ppl{display:flex;flex-direction:column;align-items:center;gap:6px;width:62px;font-size:.75rem;text-align:center}
.ppl span.nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppl .plus{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.boostc{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#1f1f1f,#000);color:#fff;border-radius:22px;padding:16px;width:100%}
.boostc .bi{width:46px;height:46px;border-radius:14px;background:#EE0000;display:grid;place-items:center}
.boostc b{font-size:1.0625rem}.boostc small{display:block;opacity:.9;font-size:.8125rem;margin-top:2px}
.req .btn.sm{margin-left:auto}

/* Tarjeta */
.cardw{container-type:inline-size;width:100%}
.cardw.sm{width:58px;flex:none}
.cardv{position:relative;width:100%;aspect-ratio:1.586;border-radius:6.4cqw;padding:6.4cqw 7cqw;color:var(--cfg,#fff);background:var(--cbg);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 22px 44px -16px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.16);transition:transform .25s ease-out,filter .4s}
.cardv::before{content:"";position:absolute;inset:0;background:radial-gradient(130% 80% at 0% 0%,rgba(255,255,255,.28),transparent 55%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.22));pointer-events:none}
.cardv::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 92% 112%,rgba(255,255,255,.16) 0 30%,transparent 31%),radial-gradient(circle at 108% 82%,rgba(255,255,255,.1) 0 26%,transparent 27%);pointer-events:none}
.cardv.frozen{filter:saturate(.15) brightness(.85)}
.cv-top,.cv-mid,.cv-bot{position:relative;display:flex;align-items:center;justify-content:space-between}
.cv-brand{font-weight:700;font-size:5.6cqw;letter-spacing:-.02em;display:flex;align-items:center;gap:2cqw;text-transform:lowercase}
.cv-brand i{width:6cqw;height:6cqw;border-radius:1.7cqw;background:currentColor;position:relative;display:block}
.cv-brand i::after{content:"";position:absolute;left:22%;right:22%;top:30%;bottom:22%;border-radius:.4cqw .4cqw 1.2cqw 1.2cqw;background:var(--cbg-solid,#222)}
.cv-type{font-size:3.1cqw;font-weight:600;letter-spacing:.14em;opacity:.8}
.cv-chip{position:relative;overflow:hidden;width:13.5cqw;height:10.4cqw;border-radius:2cqw;background:linear-gradient(135deg,#f6e3b0,#c9a35a 55%,#ecd08c);box-shadow:inset 0 0 0 .3cqw rgba(0,0,0,.28)}
.cv-chip::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 31%,rgba(0,0,0,.28) 32% 33.5%,transparent 35% 65%,rgba(0,0,0,.28) 66.5% 68%,transparent 69%),linear-gradient(0deg,transparent 47.5%,rgba(0,0,0,.28) 48.5% 51.5%,transparent 52.5%)}
.cv-nfc{width:7cqw;height:7cqw;opacity:.85}
.cv-nfc.i{stroke-width:1.6}
.cv-num{font-family:var(--mono);font-size:6cqw;letter-spacing:.1em;font-weight:500;position:relative;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.cv-bot{align-items:flex-end;font-size:3.4cqw;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.cv-bot small{display:block;font-size:2.4cqw;opacity:.7;margin-bottom:.5cqw}
.cv-frost{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:1.5cqw;background:rgba(235,240,250,.28);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);font-weight:600;font-size:4.2cqw;z-index:2}
.cv-frost .i{width:12cqw;height:12cqw}
.cardw.sm .cardv{border-radius:9px;padding:6px 7px;box-shadow:0 6px 12px -6px rgba(0,0,0,.5)}
.cardw.sm .cv-top,.cardw.sm .cv-bot,.cardw.sm .cv-num{display:none}
.cardw.sm .cv-mid{margin-top:auto}

(function(){
'use strict';
/* ============ Utilidades ============ */
/* Logo de Chiripa: una C hecha de moneda, con una moneda suelta en la abertura */
const logo=(size,bare)=>`<svg class="logo" width="${size}" height="${size}" viewBox="0 0 64 64" role="img" aria-label="Chiripa">${bare?'':'<rect width="64" height="64" rx="17" fill="#EE0000"/>'}<g fill="${bare?'currentColor':'#fff'}"><circle cx="22.5" cy="22.5" r="11.5"/><circle cx="41.5" cy="22.5" r="11.5"/><circle cx="41.5" cy="41.5" r="11.5"/><circle cx="22.5" cy="41.5" r="11.5"/></g>${bare?'':'<circle cx="32" cy="32" r="3.8" fill="#EE0000"/>'}</svg>`;

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c)=>`<svg class="i ${c||''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const nf=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const money=(c,o)=>{o=o||{};const v=nf.format(Math.abs(c)/100);if(o.abs)return v;return (c<0?'−':(o.sign&&c>0?'+':''))+v;};
const tf=new Intl.DateTimeFormat('es-US',{hour:'numeric',minute:'2-digit'});
const sdf=new Intl.DateTimeFormat('es-US',{day:'numeric',month:'short'});
const wdf=new Intl.DateTimeFormat('es-US',{weekday:'short',day:'numeric',month:'short'});
const ldf=new Intl.DateTimeFormat('es-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();};
const dayLabel=ts=>{const k=dayKey(ts),n=Date.now();if(k===dayKey(n))return'Hoy';if(k===dayKey(n-864e5))return'Ayer';return cap(wdf.format(ts).replace(/\./g,''));};
const shortWhen=ts=>{const k=dayKey(ts),n=Date.now();if(k===dayKey(n))return tf.format(ts);if(k===dayKey(n-864e5))return'Ayer';return sdf.format(ts).replace(/\./g,'');};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byId=(a,id)=>a.find(x=>x.id===id);
const AVC=['#FF9500','#34C759','#5856D6','#FF2D55','#30B0C7','#AF52DE','#007AFF','#E8590C'];
const hash=s=>{let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h);};
const initials=n=>{const p=String(n).replace(/^\$/,'').trim().split(/\s+/).filter(Boolean);return(((p[0]||'?')[0])+(p.length>1?p[p.length-1][0]:'')).toUpperCase();};
const av=(name,size,me)=>`<span class="av${me?' me':''}" style="--s:${size||40}px;${me?'':'background:'+AVC[hash(name)%AVC.length]}">${esc(initials(name))}</span>`;
const luhnDigit=p=>{let s=0;for(let i=p.length-1,d=true;i>=0;i--,d=!d){let n=+p[i];if(d){n*=2;if(n>9)n-=9;}s+=n;}return(10-s%10)%10;};
const genCard=()=>{let p='4000';for(let i=0;i<11;i++)p+=Math.floor(Math.random()*10);p+=luhnDigit(p);return p.replace(/(.{4})/g,'$1 ').trim();};
const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1));

  {id:'rojo',n:'Rojo',bg:'linear-gradient(145deg,#FF2B2B,#9E0000)',fg:'#fff',solid:'#9E0000'},

const FAQ=[
  ['¿Cómo envío dinero?','Toca el botón $ del centro, escribe el importe, elige a la persona y confirma con tu código o Face ID. El envío es instantáneo y gratis entre usuarios de Chiripa.'],
  ['¿Cómo funciona la tarjeta virtual?','Tu tarjeta de débito virtual usa tu saldo de Chiripa. Puedes ver sus datos, congelarla al instante, cambiarle el color, fijar un límite diario y añadirla a Wallet.'],
  ['¿Qué son los ahorros?','Son metas de ahorro. El dinero que mueves a una meta de ahorro sale de tu saldo disponible y queda apartado hasta que lo retires. También puedes redondear tus compras y guardar el cambio.'],
  ['¿Cuánto cuesta retirar a mi banco?','El retiro estándar es gratis y tarda de 1 a 3 días hábiles. El instantáneo cuesta 1.5 % (mínimo $0.25).'],
  ['¿Qué hago si pierdo mi tarjeta?','Congélala desde la pestaña Tarjeta. Si no la vas a recuperar, usa Reemplazar tarjeta: se genera un número nuevo y el anterior deja de funcionar.'],
  ['¿Olvidé mi contraseña?','En la pantalla de inicio de sesión toca ¿Olvidaste tu contraseña? y escribe la clave de recuperación de 16 caracteres que guardaste al crear la cuenta. Puedes generar una clave nueva desde Perfil, en Seguridad.'],
  ['¿Esto mueve dinero real?','No. Chiripa es una demostración: los bancos, la tarjeta y los pagos son simulados. Tu cuenta, tu actividad y tus transferencias se sincronizan con la base de datos de Amazon para que otros usuarios te encuentren y te paguen en tiempo real.']
];

/* ============ Estado ============ */
const KEY='chiripa.v1',OLDKEY='bolsillo.v1';
let mem=null;
const store={get(){try{return localStorage.getItem(KEY)||localStorage.getItem(OLDKEY);}catch(e){return mem;}},set(v){mem=v;try{localStorage.setItem(KEY,v);}catch(e){}}};

function seed(){
  const now=Date.now();
  return {
    v:2,
    user:{name:'Usuario Nuevo',tag:'$usuario'+rnd(100,999),phone:'Sin añadir',email:'Sin añadir',pin:'1234',pinDef:true},
    onboarded:false,bioId:null,totp:null,kyc:null,contacts:[],favs:{},goals:[],txs:[],banks:[],
    notifs:[{id:'n1',ts:now,title:'Bienvenido a Chiripa',body:'Vincula un banco y añade dinero para empezar.',read:false}],
    boost:null,
    card:{number:genCard(),exp:'09/29',cvv:String(rnd(100,999)),color:'rojo',frozen:false,wallet:false,online:true,limit:100000},
    settings:{theme:'auto',faceid:false,autoLock:0,lockOpen:false,push:true,hideBal:false,roundupGoal:null},
    dd:{routing:'110 000 077',account:String(rnd(1000,9999))+' '+String(rnd(1000,9999))+' '+String(rnd(1000,9999))},
    lockUntil:0
  };
}
function load(){try{const r=store.get();if(r){const o=JSON.parse(r);if(o&&o.v===2&&o.user&&o.txs){if(!o.favs)o.favs={};return o;}}}catch(e){}return seed();}
let S=load();
const save=()=>{store.set(JSON.stringify(S));queueDb();};
const bal=()=>allTx().reduce((a,t)=>a+(t.eff||0),0);
const savedTotal=()=>S.goals.reduce((a,g)=>a+g.saved,0);
const addTx=o=>{const t=Object.assign({id:uid('t'),status:'ok',ts:Date.now()},o);S.txs.push(t);save();return t;};
const weeklySent=()=>{const lim=Date.now()-7*864e5;return allTx().filter(t=>t.type==='send'&&t.status==='ok'&&t.ts>lim).reduce((a,t)=>a-t.amt,0);};
const cardSpentToday=()=>{const k=dayKey(Date.now());return allTx().filter(t=>t.type==='card'&&t.status==='ok'&&dayKey(t.ts)===k).reduce((a,t)=>a-t.amt,0);};
const applyTheme=()=>{const t=S.settings.theme,r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);};

/* ============ Toasts ============ */
function toast(t,s,kind,icon){
  kind=kind||'ok';
  const box=$('#toasts');
  while(box.children.length>=3)box.firstChild.remove();
  const el=document.createElement('div');
  el.className='toast';
  el.setAttribute('role','status');
  el.innerHTML=`<span class="ti ${kind==='ok'?'':kind}">${ic(icon||(kind==='bad'?'x':kind==='info'?'bell':'check'))}</span><div><b>${esc(t)}</b>${s?`<span>${esc(s)}</span>`:''}</div>`;
  box.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
  setTimeout(()=>{el.classList.remove('in');setTimeout(()=>el.remove(),500);},3800);
}

/* ============ Teclado y montos ============ */
function keypad(mode){
  const keys=['1','2','3','4','5','6','7','8','9',mode==='pin'?'':'.','0','del'];
  return '<div class="keypad" role="group" aria-label="Teclado numérico">'+keys.map(k=>k===''?'<span></span>':`<button class="key" data-act="key" data-k="${k}" aria-label="${k==='del'?'Borrar':k==='.'?'Punto decimal':k}">${k==='del'?ic('back'):k}</button>`).join('')+'</div>';
}
function keyIn(s,k){
  if(k==='del')return s.slice(0,-1);
  if(k==='.')return s.includes('.')?s:(s||'0')+'.';
  if(s==='0')return k;
  const p=s.split('.');
  if(p[1]!==undefined&&p[1].length>=2)return s;
  if(p[1]===undefined&&p[0].length>=6)return s;
  return s+k;
}
const toC=s=>{if(!s)return 0;const p=s.split('.');return(parseInt(p[0]||'0',10)||0)*100+(parseInt(((p[1]||'')+'00').slice(0,2),10)||0);};
function amtText(s){if(!s)return'$0';const p=s.split('.');return'$'+(parseInt(p[0]||'0',10)).toLocaleString('en-US')+(p[1]!==undefined?'.'+p[1]:'');}
function amtClass(s){const n=amtText(s).length;return'amt'+(s===''?' z':'')+(n>11?' s':n>8?' m':'');}
function amountBody(sh){
  const o=sh.o;
  return `${o.top?o.top(sh):''}<div class="amt-wrap"><div class="${amtClass(sh.v)}" id="amtV" aria-live="polite">${amtText(sh.v)}</div><div class="amt-sub" id="amtH"></div></div>
  ${o.chips?`<div class="chips">${o.chips.map(c=>`<button class="chip" data-act="amt-chip" data-c="${c}">${money(c).replace('.00','')}</button>`).join('')}</div>`:''}
  ${keypad()}
  ${o.extra?o.extra(sh):''}
  <div class="pad-b"><button class="btn" id="amtGo" data-act="amt-go">${o.cta}</button></div>`;
}
function paintAmount(sh){
  const o=sh.o,c=toC(sh.v),v=$('#amtV',sh.body);
  if(!v)return;
  v.className=amtClass(sh.v);v.textContent=amtText(sh.v);
  const h=o.hint?o.hint(c,sh):null,hh=$('#amtH',sh.body);
  hh.textContent=h?h.t:'';hh.className='amt-sub'+(h&&h.bad?' neg':'');
  $('#amtGo',sh.body).disabled=!(c>0&&(!o.ok||o.ok(c,sh)));
}
function openAmount(o){
  const sh=openSheet({title:o.title,left:o.left||'close',size:o.size||'',body:amountBody,mount:paintAmount,props:{o,v:o.init||''}});
  sh.onKey=k=>{sh.v=keyIn(sh.v,k);paintAmount(sh);};
  return sh;
}

/* ============ PIN / Face ID (simulado) ============ */
function pinBody(s){
  const o=s.po;
  const brand=o.brand?`<div class="lock-brand">${logo(64)}<span style="background:none;width:auto;height:auto;display:block;color:var(--fg);font-weight:800;letter-spacing:-.04em;text-transform:lowercase">chiripa</span></div>`:`<div class="lock-brand"><span style="background:var(--fill);color:var(--fg)">${ic('lock')}</span></div>`;
  if(s.pmode==='face')return `<div class="pin">${brand}<div class="scanning">${ic('faceid')}</div><p class="pin-sub">Confirma con Face ID o la huella de tu dispositivo…</p><button class="btn plain" style="width:auto;padding:0 20px" data-act="pin-code">Usar código</button></div>`;
  return `<div class="pin">${brand}<h3 id="pinT" style="margin:0;font-size:1.25rem">${esc(o.title)}</h3><p class="pin-sub" id="pinS">${esc(o.sub||'')}</p><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>${keypad('pin')}${o.forgot?'<button class="btn plain" style="width:auto;padding:0 16px" data-act="pin-forgot">¿Olvidaste tu código?</button>':''}</div>`;
}
function paintDots(s){$$('#dots i',s.body).forEach((d,i)=>d.classList.toggle('on',i<s.pin.length));}
function openPinPad(o){
  const sh=openSheet({title:'',size:'full',left:o.nocancel?'none':'close',nocancel:o.nocancel,body:pinBody,props:{po:o,pin:'',pmode:(o.face&&S.settings.faceid&&S.bioId)?'face':'code'},
    mount:s=>{
      if(s.pmode==='face'){bioAuth().then(ok=>{if(!sheets.includes(s)||s.pmode!=='face')return;if(ok)o.onSuccess();else{s.pmode='code';s.render();}});}
      else paintDots(s);
    }});
  sh.onKey=k=>{
    if(sh.pmode!=='code'||sh.busy)return;
    if(k==='del')sh.pin=sh.pin.slice(0,-1);
    else if(sh.pin.length<4)sh.pin+=k;
    paintDots(sh);
    if(sh.pin.length===4){sh.busy=true;setTimeout(()=>{sh.busy=false;if(sheets.includes(sh))o.onPin(sh.pin,sh);},140);}
  };
  sh.pinFail=(msg,title)=>{
    sh.pin='';paintDots(sh);
    const d=$('#dots',sh.body);if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');}
    if(title&&$('#pinT',sh.body))$('#pinT',sh.body).textContent=title;
    const p=$('#pinS',sh.body);if(p){p.textContent=msg||'';p.style.color='var(--red)';}
  };
  sh.pinReset=(title,sub)=>{
    sh.pin='';paintDots(sh);
    $('#pinT',sh.body).textContent=title;
    const p=$('#pinS',sh.body);p.textContent=sub||'';p.style.color='';
  };
  return sh;
}
function requirePin(reason,cb,opts){
  opts=opts||{};
  if(S.lockUntil>Date.now()&&!opts.nocancel){toast('Código bloqueado','Inténtalo de nuevo en unos segundos','bad','lock');return null;}
  let tries=0;
  const done=()=>{if(S.totp&&opts.nocancel)askTotp(cb);else if(cb)cb();};
  const sh=openPinPad({forgot:true,title:reason||'Ingresa tu código',sub:S.user.pinDef?'Código de demostración: 1234':'',face:!opts.forcePin,nocancel:opts.nocancel,brand:opts.brand,
    onSuccess(){closeSheet(sh);done();},
    async onPin(p,s){
      if(S.lockUntil>Date.now())return s.pinFail('Espera unos segundos e inténtalo otra vez');
      if(await chkPin(p)){closeSheet(s);done();return;}
      tries++;
      if(tries>=5){
        S.lockUntil=Date.now()+30000;save();tries=0;
        if(opts.nocancel)s.pinFail('Demasiados intentos. Espera 30 segundos');
        else{closeSheet(s);toast('Demasiados intentos','Espera 30 segundos','bad','lock');}
      }else s.pinFail(`Código incorrecto. Te quedan ${5-tries} intentos`);
    }});
  return sh;
}
function openLock(){
  if(sheets.some(s=>s.isLock))return;
  const sh=requirePin('Inicia sesión',null,{nocancel:true,brand:true});
  if(sh)sh.isLock=true;
}
function changePin(){
  let stage='old',first='';
  openPinPad({title:'Código actual',sub:'Escribe tu código de 4 dígitos',
    async onPin(p,s){
      if(stage==='old'){if(!(await chkPin(p)))return s.pinFail('Código incorrecto');stage='new';s.pinReset('Código nuevo','Elige 4 dígitos');}
      else if(stage==='new'){if(await chkPin(p))return s.pinFail('Elige un código distinto al actual');first=p;stage='conf';s.pinReset('Confirma el código','Vuelve a escribirlo');}
      else{
        if(p!==first){stage='new';return s.pinFail('No coinciden. Elige el código otra vez','Código nuevo');}
        await setPin(p);save();closeSheet(s);toast('Código actualizado','Úsalo para confirmar tus pagos','ok','lock');render();
      }
    }});
}

/* ============ Cuenta compartida en tiempo real (db) ============ */
let DB=null,UID=null,dir={},shared={},seenInit={},dbT=null,dbBusy=false,dbDirty=false;
const nameOf=id=>dir[id]?dir[id].name:'Usuario';
const allTx=()=>S.txs.concat(Object.values(shared).map(fromTransfer));
function fromTransfer(t){
  const b={id:t.id,ts:t.ts,note:t.note||'',shared:true,status:t.status};
  if(t.kind==='send'){
    if(t.from===UID)return Object.assign(b,{type:'send',who:t.to,title:nameOf(t.to),amt:-t.amt,eff:t.fromBank?0:-t.amt,method:t.fromBank?'Banco vinculado':'Saldo de Chiripa'});
    return Object.assign(b,{type:'receive',who:t.from,title:nameOf(t.from),amt:t.amt,eff:t.amt});
  }
  const ok=t.status==='ok';
  if(t.to===UID)return Object.assign(b,{type:'request_out',who:t.from,title:nameOf(t.from),amt:t.amt,eff:ok?t.amt:0,method:ok?'Saldo de Chiripa':''});
  return Object.assign(b,{type:'request_in',who:t.to,title:nameOf(t.to),amt:-t.amt,eff:ok?-t.amt:0,method:ok?'Saldo de Chiripa':''});
}
function queueDb(){if(!DB)return;dbDirty=true;clearTimeout(dbT);dbT=setTimeout(flushDb,700);}
async function flushDb(){
  if(!DB)return;
  if(dbBusy){dbT=setTimeout(flushDb,400);return;}
  dbBusy=true;dbDirty=false;
  try{const rest=Object.assign({},S);delete rest.contacts;delete rest.kyc;rest.user=Object.assign({},S.user);delete rest.user.pin;rest.card=Object.assign({},S.card);delete rest.card.number;delete rest.card.cvv;await DB.doc('data/users/'+UID+'/state').set(JSON.parse(JSON.stringify(rest)));}catch(e){}
  dbBusy=false;if(dbDirty)queueDb();
}
async function claimTag(tag,uid){
  const ref=DB.doc('tags/'+tag.replace('$','').toLowerCase());
  try{
    const r=await ref.acquire({holder:uid,ttlMs:4000});
    if(!r.acquired)return false;
    const sn=await ref.get();
    if(sn.exists&&sn.data().uid&&sn.data().uid!==uid)return false;
    await ref.set({uid});return true;
  }catch(e){return false;}
}
async function claimAnyTag(base){
  if(await claimTag(base,UID))return base;
  for(let i=0;i<8;i++){const t=base.replace(/\d+$/,'')+rnd(100,9999);if(await claimTag(t,UID))return t;}
  return base;
}
async function sendTransfer(o){
  const ref=DB.collection('transfers').doc();
  const t={kind:o.kind,from:o.from,to:o.to,amt:o.amt,note:o.note||'',status:o.kind==='send'?'ok':'pending',ts:Date.now(),fromBank:!!o.fromBank};
  shared[ref.id]=Object.assign({id:ref.id},t);
  try{await ref.set(t);}catch(e){delete shared[ref.id];throw e;}
  return shared[ref.id];
}
function setTransferStatus(id,status){
  const t=shared[id];if(!t||!DB)return;
  const old=t.status;t.status=status;refresh();
  DB.doc('transfers/'+id).update({status}).catch(()=>{t.status=old;refresh();toast('No se pudo actualizar','Inténtalo otra vez','bad');});
}
function setDir(snap){
  dir={};
  snap.docs.forEach(d=>{const v=d.data();dir[d.id]={name:v.name||'Usuario',tag:v.tag||''};});
  S.contacts=Object.keys(dir).filter(id=>id!==UID).map(id=>({id,name:dir[id].name,tag:dir[id].tag,fav:!!(S.favs&&S.favs[id])}));
  refresh();
}
function onTransfers(snap,key){
  const first=!seenInit[key];seenInit[key]=true;
  snap.docChanges().forEach(ch=>{
    const t=Object.assign({id:ch.doc.id},ch.doc.data());
    if(ch.type==='removed'){delete shared[t.id];return;}
    const prev=shared[t.id];shared[t.id]=t;
    if(first)return;
    if(ch.type==='added'&&!prev){
      if(t.kind==='send'&&t.to===UID)notify(nameOf(t.from)+' te envió '+money(t.amt),t.note||'','in');
      else if(t.kind==='request'&&t.from===UID&&t.status==='pending')notify(nameOf(t.to)+' te solicita '+money(t.amt),t.note||'','in');
    }else if(prev&&prev.status!==t.status&&t.kind==='request'&&t.to===UID){
      if(t.status==='ok')notify(nameOf(t.from)+' pagó tu solicitud',money(t.amt),'in');
      else if(t.status==='declined')notify(nameOf(t.from)+' rechazó tu solicitud',money(t.amt),'info');
    }
  });
  refresh();
}
async function startShared(){
  try{
    const db=window.ChiripaCloud&&window.ChiripaCloud.db,user=window.ChiripaCloud&&window.ChiripaCloud.user;
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    DB=db;UID=id;
    const me=await user.me(),cw=await user.can('data.write');
    if(cw===false){ui.ro=true;render();}
    const sref=DB.doc('data/users/'+UID+'/state'),snap=await sref.get();
    if(snap.exists&&snap.data().v===2){const L=S;S=Object.assign(seed(),JSON.parse(JSON.stringify(snap.data())));S.card.number=L.card.number;S.card.cvv=L.card.cvv;S.kyc=L.kyc||null;if(!S.favs)S.favs={};S.contacts=[];applyTheme();}
    else{if(me.name)S.user.name=me.name;}
    const aref=DB.doc('accounts/'+UID),a=await aref.get();
    if(a.exists){S.user.name=a.data().name||S.user.name;S.user.tag=a.data().tag||S.user.tag;}
    else if(!ui.ro){S.user.tag=await claimAnyTag(S.user.tag);await aref.set({name:S.user.name,tag:S.user.tag});}
    save();render();
    gate();
    DB.collection('accounts').onSnapshot(setDir,()=>{});
    DB.collection('transfers').where('from','==',UID).onSnapshot(s=>onTransfers(s,'a'),()=>{});
    DB.collection('transfers').where('to','==',UID).onSnapshot(s=>onTransfers(s,'b'),()=>{});
  }catch(e){DB=null;}
}

const rb64=n=>btoa(String.fromCharCode.apply(null,crypto.getRandomValues(new Uint8Array(n))));
async function pbkdf(pw,salt,iter){
  if(window.crypto&&crypto.subtle){
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:iter},k,256);
    return btoa(String.fromCharCode.apply(null,new Uint8Array(bits)));
  }
  let h=5381;const t=salt+pw;for(let r=0;r<3000;r++)for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return 'x'+h;
}
const setPin=async p=>{S.user.pinH=await mkAuth(p,100000);delete S.user.pin;S.user.pinDef=false;};

async function checkAuth(pw,a){if(!a||!a.hash)return false;return (await pbkdf(pw,a.salt,a.iter))===a.hash;}

function genRecovery(){const a=crypto.getRandomValues(new Uint8Array(16));let s='';a.forEach((b,i)=>{s+=REC_AL[b%32];if(i%4===3&&i<15)s+='-';});return s;}

const b64=buf=>btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function bioRegister(){

// TOTP-START
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function genSecret(){const a=crypto.getRandomValues(new Uint8Array(20));let bits='',s='';a.forEach(b=>{bits+=b.toString(2).padStart(8,'0');});for(let i=0;i<bits.length;i+=5)s+=B32[parseInt(bits.slice(i,i+5).padEnd(5,'0'),2)];return s;}
function b32dec(s){let bits='';for(const c of s)bits+=B32.indexOf(c).toString(2).padStart(5,'0');const o=[];for(let i=0;i+8<=bits.length;i+=8)o.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(o);}
async function totp(secret,t){
  const key=await crypto.subtle.importKey('raw',b32dec(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);
  const c=Math.floor(t/30000),buf=new ArrayBuffer(8),dv=new DataView(buf);
  dv.setUint32(0,Math.floor(c/4294967296));dv.setUint32(4,c%4294967296);
  const h=new Uint8Array(await crypto.subtle.sign('HMAC',key,buf)),o=h[19]&15;
  const n=(((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3])%1000000;
  return String(n).padStart(6,'0');
}
async function totpOk(secret,code){for(const d of [-1,0,1]){if(await totp(secret,Date.now()+d*30000)===code)return true;}return false;}

function qrInto(box,text){

function parseId(raw){
  raw=raw.trim();if(!raw)return null;
  if(/^\$[a-z0-9_]{2,20}$/i.test(raw)){const t=raw.toLowerCase();return t===S.user.tag.toLowerCase()?null:{kind:'$Cashtag',name:t,tag:t};}
  if(/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(raw))return{kind:'Correo',name:raw,email:raw};
  const d=raw.replace(/\D/g,'');
  if(/^[\d\s()+-]+$/.test(raw)&&(d.length===10||(d.length===11&&d[0]==='1'))){const n=d.slice(-10),f=`(${n.slice(0,3)}) ${n.slice(3,6)}-${n.slice(6)}`;return{kind:'Teléfono',name:f,phone:f};}
  return null;
}

function paintWho(s,q){
  const ql=q.trim().toLowerCase(),id=parseId(q);
  const last={};allTx().forEach(t=>{if(t.who)last[t.who]=Math.max(last[t.who]||0,t.ts);});
  const l=S.contacts.filter(c=>!ql||[c.name,c.tag,c.email,c.phone].filter(Boolean).join(' ').toLowerCase().includes(ql)).sort((a,b)=>(last[b.id]||0)-(last[a.id]||0));
  let h='';
  if(false)h+=`<div class="list-h">Nuevo</div><div class="list"><button class="row ico" data-act="pay-pick-new" data-v="${esc(q.trim())}">${av(id.name,40)}<span class="rb"><b>${esc(id.name)}</b><small>${id.kind}</small></span>${ic('chevR','chev')}</button></div>`;
  h+=l.length?`<div class="list-h">${ql?'Resultados':'Personas'}</div><div class="list">${l.map(c=>cRow(c,'pay-pick')).join('')}</div>`:(S.contacts.length?'<div class="empty">No hay nadie con ese nombre o $usuario.</div>':'<div class="empty">Aún no hay otras personas en Chiripa. Comparte la app con tus amigos y dales acceso de Colaborador; aparecerán aquí al abrirla.</div>');
  $('#payList',s.body).innerHTML=h;
}
function payMount(s){
  const P=s.P;
  if(P.step==='amt')paintAmount(s);
  else if(P.step==='who'){paintWho(s,'');$('#payQ',s.body).addEventListener('input',e=>paintWho(s,e.target.value));}
  else if(P.step==='review')$('#payNote',s.body).addEventListener('input',e=>{P.note=e.target.value;});

function doPay(s){
  const P=s.P,to=P.to,send=P.mode==='send';
  if(!DB||!UID||ui.ro){toast('No disponible','Necesitas abrir Chiripa con tu cuenta y acceso de Colaborador para enviar a otras personas','bad');return;}
  sendTransfer({kind:send?'send':'request',from:send?UID:to.id,to:send?to.id:UID,amt:P.amt,note:P.note.trim(),fromBank:send&&P.src!=='bal'})
    .then(t=>{P.res=t;P.step='done';s.render();refresh();})

}

/* Tarjeta */
function purchase(m,c){
  let reason='';
  if(S.card.frozen)reason='Tarjeta congelada';
  else if(m.online&&!S.card.online)reason='Compras en línea desactivadas';
  else if(c>bal())reason='Fondos insuficientes';
  else if(cardSpentToday()+c>S.card.limit)reason='Supera el límite diario';
  if(reason){addTx({type:'card',title:m.name,cat:m.cat,merchant:m.id,amt:-c,eff:0,status:'declined',reason,method:'Tarjeta virtual'});toast('Compra rechazada',reason,'bad');refresh();return false;}
  addTx({type:'card',title:m.name,cat:m.cat,merchant:m.id,amt:-c,eff:-c,method:'Tarjeta virtual'});
  let extra='';
  const bo=BOOSTS.find(x=>x.id===S.boost);
  if(bo&&bo.m===m.id){const cb=Math.min(bo.max,Math.round(c*bo.pct/100));addTx({type:'boost',merchant:m.id,title:'Boost: '+m.name,sub:`${bo.pct}% de reembolso`,amt:cb,eff:cb});S.boost=null;extra=` · +${money(cb)} de Boost`;}
  const g=S.settings.roundupGoal?goalOf(S.settings.roundupGoal):null,ru=(100-c%100)%100;
  if(g&&ru>0&&bal()>=ru){addTx({type:'goal',goal:g.id,title:g.name,sub:'Redondeo de compra',amt:-ru,eff:-ru});g.saved+=ru;extra+=` · ${money(ru)} a ${g.name}`;}
  save();toast('Pagaste '+money(c),m.name+extra);refresh();return true;
}

function cardTestGo(){

function settle(){
  const now=Date.now();let ch=false;
  S.txs.forEach(t=>{
    if(t.status==='pending'&&t.settleAt&&t.settleAt<=now){
      ch=true;t.settleAt=0;t.status='ok';
      if(t.type==='request_out'){t.eff=t.amt;notify(t.title+' pagó tu solicitud',money(t.amt)+(t.note?' · '+t.note:''),'in');}
      else if(t.type==='cashout')notify('Retiro completado',`${money(t.amt,{abs:true})} llegó a tu banco`);
    }
  });
  if(ch){save();refresh();}
}

document.addEventListener('keydown',e=>{
  const s=top();
  if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.enter){const b=s&&$('[data-act="'+e.target.dataset.enter+'"]',s.body);if(b&&!b.disabled)b.click();return;}
  if(e.key==='Escape'&&s&&!s.cfg.nocancel){closeSheet(s);return;}
  const inField=/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''));
  if(!s||!s.onKey||inField)return;
  if(/^[0-9]$/.test(e.key))s.onKey(e.key);
  else if((e.key==='.'||e.key===',')&&!s.pmode)s.onKey('.');
  else if(e.key==='Backspace')s.onKey('del');
